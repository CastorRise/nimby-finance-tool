<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>NIMBY · 财务地图分析台</title>
<script src="src/theme.js"></script>
<link rel="icon" type="image/png" sizes="32x32" href="assets/rail-route-32.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <img class="logo" src="assets/rail-route.png" width="32" height="32" alt="" aria-hidden="true">
    <div class="brand-txt">
      <h1>NIMBY 财务</h1>
      <span class="brand-sub" id="brand-sub">线路经营分析</span>
    </div>
  </div>
  <div id="tb-center">
    <button id="btn-open-import" class="btn primary">＋ 导入数据</button>
    <span id="import-quick" class="tb-quick hidden">
      <label class="lbl" for="sel-active-import">当前档案</label>
      <select id="sel-active-import" aria-label="当前档案"></select>
    </span>
  </div>
  <div class="tb-right">
    <button id="btn-export-center" class="btn ghost">导出与备份</button>
    <button id="btn-theme" class="btn ghost icon" type="button" aria-label="切换外观" title="切换外观">◐</button>
    <button id="btn-help" class="btn ghost icon" title="使用说明" aria-label="使用说明">?</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <details class="panel disclosure" id="panel-imports">
      <summary>档案管理 <span id="imp-count" class="count"></span></summary>
      <ul id="import-list" class="import-list"></ul>
      <div class="empty-hint hidden" id="import-list-empty">尚无档案，点击顶部「导入数据」</div>
    </details>

    <section class="panel" id="panel-period">
      <div class="p-head"><span>分析周期</span></div>
      <div class="seg" id="seg-granularity" title="账目粒度"></div>
      <label class="field-label">账期
        <select id="sel-bucket"></select>
      </label>
    </section>

    <section class="panel" id="panel-mapopt">
      <div class="p-head"><span>地图显示</span></div>
      <div class="chk-row">
        <label class="chk"><input type="checkbox" id="chk-lines" checked><span>线路</span></label>
        <label class="chk"><input type="checkbox" id="chk-stations" checked><span>站点热度</span></label>
      </div>
      <div class="heat-cfg">
        <label class="field-label">站点热度指标
          <select id="sel-metric-station"></select>
        </label>
        <label class="field-label">线路热度指标
          <select id="sel-metric-line"></select>
        </label>
      </div>
      <details class="sub-disclosure" id="map-more">
        <summary>更多地图设置</summary>
        <label class="chk"><input type="checkbox" id="chk-labels" checked><span>放大后显示站名</span></label>
        <label class="field-label">颜色方案
          <select id="sel-scheme">
            <option value="seq">热度渐变 (浅→深)</option>
            <option value="div">盈亏分色 (红亏绿盈)</option>
          </select>
        </label>
        <label class="field-label">数值标尺
          <select id="sel-scale"><option value="sqrt">平方根(适合热度)</option><option value="linear">线性</option><option value="log">对数</option></select>
        </label>
        <div class="p-sub">地图区域 <span id="region-count" class="count"></span></div>
        <div class="field-note">仅控制地图显示，财务汇总仍为全网。</div>
        <div id="region-chips" class="chips"></div>
        <div class="row2">
        <button id="btn-region-all" class="btn ghost xs">显示全部</button>
        <button id="btn-region-fit" class="btn ghost xs">适配当前区域</button>
        </div>
      </details>
    </section>

    <details class="panel disclosure" id="panel-legend-panel">
      <summary>图例与数据说明</summary>
      <div id="legend-heat"></div>
      <div id="legend-net" class="legend-net"></div>
    </details>

    <details id="rankpanel" class="panel disclosure">
      <summary>经营摘要</summary>
      <section class="summary-section" id="panel-company-cards">
        <div class="p-head"><span>当前账期</span></div>
        <div id="metriccards"></div>
      </section>
      <section class="summary-section">
        <div class="p-head"><span>排行</span></div>
        <div class="rank-tabs" role="tablist" aria-label="经营排行">
          <button id="rank-worst" class="rank-tab active" role="tab" aria-selected="true" data-rank="worst">最亏损</button>
          <button id="rank-best" class="rank-tab" role="tab" aria-selected="false" data-rank="best">最盈利</button>
          <button id="rank-busy" class="rank-tab" role="tab" aria-selected="false" data-rank="busy">客流站点</button>
        </div>
        <div id="ranklist" role="tabpanel" aria-labelledby="rank-worst"></div>
      </section>
      <section class="summary-section">
        <div class="p-head"><span>说明</span></div>
        <div id="datatips" class="datatips"></div>
      </section>
    </details>
  </aside>

  <main id="main">
    <div id="overview-top">
      <div id="kpis"></div>
      <div id="mapwrap">
        <div id="map"></div>
        <div id="map-top-left">
          <button class="maptool" id="btn-fit-world" title="缩放到全部" aria-label="缩放到全部线路和站点">⛶ 全部</button>
        </div>
        <div id="map-coords"></div>
      </div>
    </div>

    <div id="tabsbar" role="tablist" aria-label="分析页面">
      <button id="tab-overview" class="tab active" role="tab" aria-selected="true" data-tab="overview">运营总览</button>
      <button id="tab-advisor" class="tab" role="tab" aria-selected="false" data-tab="advisor">运营诊断</button>
      <button id="tab-lines" class="tab" role="tab" aria-selected="false" data-tab="lines">线路财务</button>
      <button id="tab-stations" class="tab" role="tab" aria-selected="false" data-tab="stations">站点客流</button>
      <button id="tab-trend" class="tab" role="tab" aria-selected="false" data-tab="trend">走势趋势</button>
      <button id="tab-compare" class="tab" role="tab" aria-selected="false" data-tab="compare">历史对比</button>
      <span class="tab-spacer"></span>
      <span id="view-hint" class="view-hint"></span>
    </div>
    <div id="tabview" role="tabpanel"></div>
  </main>

</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="false"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/echarts/echarts.min.js"></script>
<script src="src/core.js"></script>
<script src="src/parser.js"></script>
<script src="src/engine.js"></script>
<script src="src/store.js"></script>
<script src="src/mapview.js"></script>
<script src="src/charts.js"></script>
<script src="src/advisor.js"></script>
<script src="src/tables.js"></script>
<script src="src/compare.js"></script>
<script src="src/exportcenter.js"></script>
<script src="src/app.js"></script>
</body>
</html>
